<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Health Goals - DiabetesCare</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="header-content">
            <a href="/" class="logo">DiabetesCare</a>
            <nav>
                <ul>
                    <li><a href="/">Home</a></li>
                    <li><a href="/checkup">Checkup</a></li>
                    <li><a href="/monitoring">Monitoring</a></li>
                    <li><a href="/contact">Contact</a></li>
                    <li><a href="/feedback">Feedback</a></li>
                    <li><a href="/dashboard">Dashboard</a></li>
                    <li><a href="/logout">Logout</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="form-section">
            <div class="form-container">
                <h1><i class="fas fa-bullseye"></i> Set Health Goals</h1>

                <form method="POST" class="goals-form">
                    <div class="form-group">
                        <label for="goal_type"><i class="fas fa-flag"></i> Goal Type</label>
                        <select id="goal_type" name="goal_type" required>
                            <option value="">Select goal type</option>
                            <option value="weight">Weight Management</option>
                            <option value="exercise">Exercise</option>
                            <option value="blood pressure">Blood Pressure</option>
                            <option value="glucose">Blood Glucose</option>
                            <option value="water intake">Water Intake</option>
                            <option value="sleep">Sleep Quality</option>
                            <option value="medication adherence">Medication Adherence</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="target_value"><i class="fas fa-target"></i> Target Value</label>
                            <input type="number" id="target_value" name="target_value" min="0" step="0.1" required placeholder="Enter target value">
                        </div>

                        <div class="form-group">
                            <label for="unit"><i class="fas fa-ruler"></i> Unit</label>
                            <input type="text" id="unit" name="unit" required placeholder="e.g., kg, minutes, mmHg">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="target_date"><i class="fas fa-calendar-alt"></i> Target Date</label>
                        <input type="date" id="target_date" name="target_date">
                        <small>Leave empty for ongoing goals</small>
                    </div>

                    <div class="form-group">
                        <label for="notes"><i class="fas fa-sticky-note"></i> Goal Description/Notes</label>
                        <textarea id="notes" name="notes" rows="3" placeholder="Describe your goal and why it's important to you..."></textarea>
                    </div>

                    <div class="goal-preview">
                        <h3><i class="fas fa-eye"></i> Goal Preview</h3>
                        <div id="goal_preview" class="goal-preview-text">
                            Set a goal to achieve your target value.
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-primary">
                            <i class="fas fa-save"></i> Set Goal
                        </button>
                        <a href="/monitoring" class="btn-secondary">
                            <i class="fas fa-times"></i> Cancel
                        </a>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <script>
        // Update goal preview
        function updateGoalPreview() {
            const goalType = document.getElementById('goal_type').value;
            const targetValue = document.getElementById('target_value').value;
            const unit = document.getElementById('unit').value;
            const targetDate = document.getElementById('target_date').value;

            let preview = 'Set a goal to ';

            if (goalType && targetValue && unit) {
                preview = `I want to ${goalType} and reach ${targetValue} ${unit}`;

                if (targetDate) {
                    const date = new Date(targetDate).toLocaleDateString();
                    preview += ` by ${date}`;
                }
                preview += '.';
            } else {
                preview = 'Set a goal to achieve your target value.';
            }

            document.getElementById('goal_preview').textContent = preview;
        }

        // Add event listeners
        document.getElementById('goal_type').addEventListener('change', updateGoalPreview);
        document.getElementById('target_value').addEventListener('input', updateGoalPreview);
        document.getElementById('unit').addEventListener('input', updateGoalPreview);
        document.getElementById('target_date').addEventListener('change', updateGoalPreview);

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            updateGoalPreview();
        });
    </script>

    <footer>
        <p>&copy; 2025 DiabetesCare. All rights reserved.</p>
    </footer>
</body>
</html>
